<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistèm Kat Rezidans ak Ekspòtasyon PDF</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        /* --- ESTIL JENERAL --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle, #1e272e 0%, #0f141c 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: #fff;
            box-sizing: border-box;
        }

        .main-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
        }

        /* --- STIL POU FÒMILÈ A --- */
        .form-section {
            width: 360px;
        }

        .form-section h2 {
            margin: 0 0 5px 0;
            font-size: 24px;
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-section p {
            font-size: 13px;
            color: #8a99ad;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            color: #00d2ff;
            margin-bottom: 6px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
            transition: 0.3s;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: #00d2ff;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 8px rgba(0, 210, 255, 0.2);
        }

        .row-inline {
            display: flex;
            gap: 15px;
        }

        /* Bouton PDF la */
        .pdf-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, #4cd137, #44bd32);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(76, 209, 55, 0.3);
            transition: 0.2s ease;
        }

        .pdf-btn:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        /* --- STIL POU KAT REZIDANS LAN --- */
        .card-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Zòn limit kote n ap pran pou PDF la sèlman */
        #pdf-area {
            padding: 10px;
            background: transparent;
        }

        .residence-card {
            width: 500px;
            height: 300px;
            background: linear-gradient(135deg, #ffffff 0%, #e3e9ed 100%);
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            padding: 20px;
            box-sizing: border-box;
            position: relative;
            border: 2px solid #2c3e50;
            color: #1e272e;
        }

        /* Test sekirite nan fon kat la */
        .residence-card::before {
            content: "RÉSIDENT";
            position: absolute;
            font-size: 55px;
            font-weight: 900;
            color: rgba(44, 62, 80, 0.03);
            transform: rotate(-20deg);
            top: 35%;
            left: 10%;
            z-index: 1;
            pointer-events: none;
        }

        .card-header {
            text-align: center;
            border-bottom: 2px double #2c3e50;
            padding-bottom: 6px;
            margin-bottom: 15px;
            position: relative;
            z-index: 2;
        }

        .card-header h1 {
            font-size: 16px;
            margin: 0;
            text-transform: uppercase;
            color: #2c3e50;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .card-header h2 {
            font-size: 11px;
            margin: 3px 0 0 0;
            color: #3a7bd5;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .card-body {
            display: flex;
            gap: 20px;
            position: relative;
            z-index: 2;
        }

        .photo-area {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .user-img {
            width: 110px;
            height: 130px;
            object-fit: cover;
            border: 2px solid #2c3e50;
            border-radius: 6px;
            background-color: #eef2f3;
        }

        .sign-area {
            margin-top: 8px;
            width: 110px;
            height: 28px;
            border: 1px dashed #7f8c8d;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #2c3e50;
            font-style: italic;
            font-weight: bold;
        }

        .info-area {
            flex-grow: 1;
            display: grid;
            grid-template-columns: 1fr;
            row-gap: 6px;
        }

        .data-box {
            display: flex;
            flex-direction: column;
        }

        .field-title {
            font-size: 9px;
            text-transform: uppercase;
            color: #7f8c8d;
            font-weight: bold;
        }

        .field-value {
            font-size: 14px;
            font-weight: 700;
            color: #2c3e50;
            text-transform: uppercase;
        }

        .card-footer {
            position: absolute;
            bottom: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            padding-top: 8px;
            font-size: 11px;
            z-index: 2;
        }

        .id-number {
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            font-weight: bold;
            color: #ff4757;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        
        <div class="form-section">
            <h2>Kreyasyon Kat</h2>
            <p>Ranpli jaden sa yo pou kreye kat la:</p>
            
            <div class="input-group">
                <label>Nom (Siyati)</label>
                <input type="text" id="inputNom" value="Souffrant" oninput="updateCard()">
            </div>
            
            <div class="input-group">
                <label>Prénom (Non)</label>
                <input type="text" id="inputPrenom" value="Robes" oninput="updateCard()">
            </div>

            <div class="row-inline">
                <div class="input-group" style="flex: 1;">
                    <label>Nationalité</label>
                    <input type="text" id="inputNationalite" value="HT" oninput="updateCard()">
                </div>
                <div class="input-group" style="flex: 1;">
                    <label>Sexe</label>
                    <select id="inputSexe" onchange="updateCard()">
                        <option value="M">Gason (M)</option>
                        <option value="F">Fi (F)</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label>Date de Naissance</label>
                <input type="text" id="inputNaissance" value="10 Janvier 1995" oninput="updateCard()">
            </div>

            <div class="input-group">
                <label>Foto (Kole lyen/URL foto a)</label>
                <input type="text" id="inputFoto" value="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQz0TuHToiNWnU1Rbr8ARH2PyhuQf4bHY0DuzbdB2h2vg&s=10" oninput="updateCard()">
            </div>

            <button class="pdf-btn" onclick="downloadPDF()">Telechaje epi Voye PDF</button>
        </div>

        <div class="card-section">
            <div id="pdf-area">
                <div class="residence-card">
                    <div class="card-header">
                        <h1>République Démocratique du Congo</h1>
                        <h2>CARTE DE RÉSIDENCE</h2>
                    </div>

                    <div class="card-body">
                        <div class="photo-area">
                            <img class="user-img" id="cardPhoto" src="" alt="Foto" crossOrigin="anonymous">
                            <div class="sign-area" id="cardSign"></div>
                        </div>

                        <div class="info-area">
                            <div class="data-box">
                                <span class="field-title">Nom / Surname</span>
                                <span class="field-value" id="cardNom"></span>
                            </div>
                            
                            <div class="data-box">
                                <span class="field-title">Prénom / Given Names</span>
                                <span class="field-value" id="cardPrenom"></span>
                            </div>

                        <div class="row-inline">
                                <div class="data-box">
                                    <span class="field-title">Nationalité / Nationality</span>
                                    <span class="field-value" id="cardNationalite"></span>
                                </div>
                                <div class="data-box">
                                    <span class="field-title">Sexe / Sex</span>
                                    <span class="field-value" id="cardSexe"></span>
                                </div>
                            </div>

                            <div class="data-box">
                                <span class="field-title">Date de Naissance / Date of Birth</span>
                                <span class="field-value" id="cardNaissance"></span>
                            </div>
                        </div>
                    </div>

                    <div class="card-footer">
                        <div><span style="color: #7f8c8d;">Expire le:</span> <b style="color: #2c3e50;">02/06/2028</b></div>
                        <div class="id-number">N° RE-849201-HT</div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Fonksyon k ap mete done yo sou kat la an dirèk
        function updateCard() {
            const nom = document.getElementById("inputNom").value;
            const prenom = document.getElementById("inputPrenom").value;
            const nat = document.getElementById("inputNationalite").value;
            const sexe = document.getElementById("inputSexe").value;
            const naissance = document.getElementById("inputNaissance").value;
            const foto = document.getElementById("inputFoto").value;

            document.getElementById("cardNom").innerText = nom;
            document.getElementById("cardPrenom").innerText = prenom;
            document.getElementById("cardNationalite").innerText = nat;
            document.getElementById("cardSexe").innerText = sexe;
            document.getElementById("cardNaissance").innerText = naissance;
            document.getElementById("cardPhoto").src = foto;
            
            if(prenom || nom) {
                document.getElementById("cardSign").innerText = prenom + "." + nom.substring(0,1);
            } else {
                document.getElementById("cardSign").innerText = "Signature";
            }
        }

        // Fonksyon k ap konvèti kat la an PDF pou moun nan ka voye l ba ou
        function downloadPDF() {
            const element = document.getElementById('pdf-area');
            const nomMoun = document.getElementById("inputNom").value || "Rezidan";
            const prenomMoun = document.getElementById("inputPrenom").value || "";

            // Paramèt pou rann kat la pwòp nan fòma PDF san fòmilè a pa parèt ladan l
            const opt = {
                margin:       0.2,
                filename:     `Kat_Residence_${prenomMoun}_${nomMoun}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 3, useCORS: true }, // scale 3 bay gwo klète (HD)
                jsPDF:        { unit: 'in', format: 'letter', orientation: 'landscape' }
            };

            // Lanse kreyasyon ak telechajman dokiman an
            html2pdf().set(opt).from(element).save();
        }

        // Lanse premye chajman an otomatikman
        window.onload = updateCard;
    </script>

</body>
</html>
